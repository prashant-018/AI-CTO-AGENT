<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Agent</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#111827;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:700px;
            height:90vh;
            background:#1f2937;
            border-radius:12px;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        .header{
            background:#2563eb;
            color:white;
            padding:18px;
            font-size:22px;
            font-weight:bold;
            text-align:center;
        }

        #chat-box{
            flex:1;
            padding:20px;
            overflow-y:auto;
        }

        .message{
            margin-bottom:15px;
            padding:12px;
            border-radius:10px;
            max-width:80%;
            line-height:1.5;
        }

        .user{
            background:#2563eb;
            color:white;
            margin-left:auto;
        }

        .bot{
            background:#374151;
            color:white;
        }

        .input-area{
            display:flex;
            padding:15px;
            background:#111827;
        }

        input{
            flex:1;
            padding:12px;
            border:none;
            outline:none;
            border-radius:8px;
            font-size:16px;
        }

        button{
            margin-left:10px;
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="header">
        AI Career Agent 🤖
    </div>

    <div id="chat-box"></div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

const chatBox=document.getElementById("chat-box");

async function sendMessage(){

    const input=document.getElementById("message");

    const message=input.value.trim();

    if(message==="") return;

    addMessage(message,"user");

    input.value="";

    try{

        const response=await fetch("http://127.0.0.1:8000/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:message
            })

        });

        const data=await response.json();

        addMessage(data.reply,"bot");

    }

    catch(error){

        addMessage("Backend Not Running","bot");

    }

}

function addMessage(text,type){

    const div=document.createElement("div");

    div.className=`message ${type}`;

    div.innerText=text;

    chatBox.appendChild(div);

    chatBox.scrollTop=chatBox.scrollHeight;

}

</script>

</body>
</html>
